---
- name: Determine primary repo server name
  ansible.builtin.set_fact:
    rm_primary_name: >-
      {{ (global_repo_servers
          | selectattr('primary', 'defined')
          | selectattr('primary')
          | map(attribute='name')
          | list
          | first) | default('', true) }}

- name: Fail if primary is missing
  ansible.builtin.fail:
    msg: >-
      No global_repo_servers has "primary: true"
  when: rm_primary_name | length == 0

- name: Determine whether this host is the primary
  ansible.builtin.set_fact:
    rm_repo_is_primary: "{{ rm_primary_name == inventory_hostname }}"

- name: Show primary determination
  debug:
    msg: >-
      {{ inventory_hostname }} is {{ 'PRIMARY' if rm_repo_is_primary else 'SECONDARY' }}

# On PRIMARY: install and enable the service and timer
- name: Install service and timer on primary server
  when: rm_repo_is_primary
  block:
    - name: Deploy systemd service unit
      ansible.builtin.template:
        src: repo_ha_sync.service.j2
        dest: '/etc/systemd/system/{{ repo_primary_timer_service_name }}.service'
        owner: root
        group: root
        mode: '0644'
      notify: reload systemd daemon

    - name: Deploy systemd timer unit
      ansible.builtin.template:
        src: repo_ha_sync.timer.j2
        dest: "/etc/systemd/system/{{ repo_primary_timer_service_name }}.timer"
        owner: root
        group: root
        mode: '0644'
      notify: reload systemd daemon

    - name: Flush handlers
      meta: flush_handlers

    - name: Enable and start the timer
      ansible.builtin.systemd_service:
        name: "{{ repo_primary_timer_service_name }}.timer"
        enabled: true
        state: started
        daemon_reload: true

    - name: Create /home/repo/.ssh
      ansible.builtin.file:
        path: '/home/repo/.ssh'
        state: directory
        owner: "{{ repo_user }}"
        group: "{{ repo_user }}"
        mode: '0700'

    - name: Create SSH key pair
      community.crypto.openssh_keypair:
        path: "/home/repo/.ssh/id_ed25519"
        type: ed25519
        comment: "{{ repo_user }}@{{ inventory_hostname }}"
        owner: "{{ repo_user }}"
        group: "{{ repo_user }}"
        mode: '0600'
      notify: rm_new_public_key
  become: true

# On SECONDARY: remove service and timer
- name: Remove service and timer from SECONDARY servers
  when: not rm_repo_is_primary
  block:
    - name: Check if timer file exists
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ repo_primary_timer_service_name }}.timer"
      register: rm_timer_file

    - name: Check if service file exists
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ repo_primary_timer_service_name }}.service"
      register: rm_service_file

    - name: Stop and disable timer if present
      ansible.builtin.systemd_service:
        name: "{{ repo_primary_timer_service_name }}.timer"
        state: stopped
        enabled: false
      when: rm_timer_file.stat.exists
      failed_when: false

    - name: Stop and disable service if present
      ansible.builtin.systemd_service:
        name: "{{ repo_primary_timer_service_name }}.service"
        state: stopped
        enabled: false
      when: rm_service_file.stat.exists
      failed_when: false

    - name: Remove timer 
      file:
        path: "/etc/systemd/system/{{ repo_primary_timer_service_name }}.timer"
        state: absent
      notify: reload systemd daemon

    - name: Remove service
      file:
        path: "/etc/systemd/system/{{ repo_primary_timer_service_name }}.service"
        state: absent
      notify: reload systemd daemon

    - name: Flush handlers
      meta: flush_handlers

    - name: Reset failed state for removed units (ignore if none)
      command: "systemctl reset-failed {{ repo_primary_timer_service_name }}.service {{ repo_primary_timer_service_name }}.timer"
      changed_when: false
      failed_when: false
  become: true
