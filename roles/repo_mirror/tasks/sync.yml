---
# 1. Work out which host is primary, and whether *this* host is it.
- name: Determine name of the primary repo server
  ansible.builtin.set_fact:
    repo_mirror-primary_name: >-
      {{ (global_repo_servers
          | selectattr('primary', 'defined')
          | selectattr('primary')
          | map(attribute='name')
          | list
          | first) | default('', true) }}

- name: Fail if no primary server is defined
  fail:
    msg: >-
      No entry in global_repo_servers has primary: true — cannot determine
      which host should run {{ repo_primary_timer_service_name }}.
  when: repo_mirror-primary_name | length == 0

- name: Determine whether this host is the primary
  ansible.builtin.set_fact:
    _repo_is_primary: "{{ repo_mirror-primary_name == inventory_hostname }}"

- name: Show primary determination
  debug:
    msg: >-
      {{ inventory_hostname }} is {{ 'PRIMARY' if _repo_is_primary else 'NOT primary' }}

# 2. On the primary host: install and enable the service + timer.
- name: Install service and timer on primary server
  when: _repo_is_primary
  block:
    - name: Deploy systemd service unit
      ansible.builtin.template:
        src: repo_ha_sync.service.j2
        dest: "/etc/systemd/system/{{ repo_primary_timer_service_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify: reload systemd daemon

    - name: Deploy systemd timer unit
      ansible.builtin.template:
        src: repo_ha_sync.timer.j2
        dest: "/etc/systemd/system/{{ repo_primary_timer_service_name }}.timer"
        owner: root
        group: root
        mode: "0644"
      notify: reload systemd daemon

    - name: Flush handlers so units are known to systemd before enabling
      meta: flush_handlers

    - name: Enable and start the timer (service itself stays "static"/oneshot)
      ansible.builtin.systemd_service:
        name: "{{ repo_primary_timer_service_name }}.timer"
        enabled: true
        state: started
        daemon_reload: true
  become: true

# 3. On any non-primary host: make sure this role's service/timer are gone.
- name: Remove service and timer from non-primary servers
  when: not _repo_is_primary
  block:
    - name: Check if timer unit file exists
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ repo_primary_timer_service_name }}.timer"
      register: repo_mirror-timer_file

    - name: Check if service unit file exists
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ repo_primary_timer_service_name }}.service"
      register: repo_mirror-service_file

    - name: Stop and disable timer if present
      ansible.builtin.systemd_service:
        name: "{{ repo_primary_timer_service_name }}.timer"
        state: stopped
        enabled: false
      when: repo_mirror-timer_file.stat.exists
      failed_when: false

    - name: Stop and disable service if present
      ansible.builtin.systemd_service:
        name: "{{ repo_primary_timer_service_name }}.service"
        state: stopped
        enabled: false
      when: repo_mirror-service_file.stat.exists
      failed_when: false

    - name: Remove timer unit file
      file:
        path: "/etc/systemd/system/{{ repo_primary_timer_service_name }}.timer"
        state: absent
      notify: reload systemd daemon

    - name: Remove service unit file
      file:
        path: "/etc/systemd/system/{{ repo_primary_timer_service_name }}.service"
        state: absent
      notify: reload systemd daemon

    - name: Flush handlers to reload systemd after removal
      meta: flush_handlers

    - name: Reset failed state for removed units (ignore if none)
      command: "systemctl reset-failed {{ repo_primary_timer_service_name }}.service {{ repo_primary_timer_service_name }}.timer"
      changed_when: false
      failed_when: false
  become: true
